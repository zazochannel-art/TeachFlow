name: Android APK

# Builds an installable APK of the Android app (mobile/) on GitHub's servers — no Expo account needed.
# Download it from the run's "Artifacts" section (teachflow-android-apk). It is signed with the
# standard test key: fine for installing on phones, not for Google Play (use EAS for that, README.md).
on:
  workflow_dispatch:
  pull_request:
    paths: ["mobile/**", ".github/workflows/android-apk.yml"]
  push:
    branches: [main]
    paths: ["mobile/**", ".github/workflows/android-apk.yml"]

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mobile
    env:
      # Optional, for push notifications (README.md → "Notificări push").
      EAS_PROJECT_ID: ${{ vars.EAS_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm ci
      - name: Firebase config for push (optional secret GOOGLE_SERVICES_JSON_B64)
        env:
          GOOGLE_SERVICES_JSON_B64: ${{ secrets.GOOGLE_SERVICES_JSON_B64 }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON_B64" ]; then echo "$GOOGLE_SERVICES_JSON_B64" | base64 -d > google-services.json; echo "push: on"; else echo "push: off (no Firebase config)"; fi
      - run: npx expo prebuild --platform android --no-install
      - uses: gradle/actions/setup-gradle@v4
      - name: Build release APK
        working-directory: mobile/android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a,x86_64
      - uses: actions/upload-artifact@v4
        with:
          name: teachflow-android-apk
          path: mobile/android/app/build/outputs/apk/release/*.apk
          retention-days: 30
